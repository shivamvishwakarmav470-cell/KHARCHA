<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha – Expense Tracker</title>
<style>
:root{--bg:#EAF2EF;--panel:#fff;--ink:#10302B;--mute:#5E7A74;--line:#CFE0DA;--accent:#0E7C66;--bad:#D64550;
--c0:#0E7C66;--c1:#E9A23B;--c2:#4B7BE5;--c3:#D64550;--c4:#8E5BD1;--c5:#7C8B88;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1C19;--panel:#13292A;--ink:#E4F2EE;--mute:#8FB0A8;--line:#24413E;--accent:#3CC4A4;--bad:#FF7480;--c0:#3CC4A4;--c1:#F2B65A;--c2:#7C9FF2;--c3:#FF7480;--c4:#B28AEA;--c5:#9BAAA7}}
:root[data-theme="dark"]{--bg:#0C1C19;--panel:#13292A;--ink:#E4F2EE;--mute:#8FB0A8;--line:#24413E;--accent:#3CC4A4;--bad:#FF7480;--c0:#3CC4A4;--c1:#F2B65A;--c2:#7C9FF2;--c3:#FF7480;--c4:#B28AEA;--c5:#9BAAA7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
main{max-width:1050px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.02em}
h2{margin:0 0 10px;font-size:1.05rem}
.big{font-size:clamp(2rem,6vw,3rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mute{color:var(--mute);font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.full{grid-column:1/-1}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer}
button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.go{color:#06201A}}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .w{grid-column:1/-1}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--accent);width:0;transition:width .4s}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
ul{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
li .dot{width:10px;height:10px;border-radius:50%;flex:none}
li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .a{font-variant-numeric:tabular-nums;font-weight:600}
li button{padding:2px 8px;color:var(--mute)}
canvas{display:block;width:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.over{color:var(--bad)}
.dev{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.dev p{flex:1;min-width:160px}.ig{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;text-decoration:none}.dev img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex:none}
footer a{color:var(--accent);font-weight:600;text-underline-offset:3px}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>Kharcha</h1>
    <div class="mute">Track what you spend. Stay under budget.</div>
  </div>
  <div><label class="mute" for="mon">Month </label><input type="month" id="mon"></div>
</header>

<div class="grid">
  <section class="card full">
    <div class="row">
      <div><div class="mute">Spent this month</div><div class="big" id="spent">₹0</div></div>
      <div style="text-align:right"><div class="mute">Monthly budget (₹)</div><input id="budget" type="number" min="0" step="100" style="width:130px" aria-label="Monthly budget"></div>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <div class="mute" id="left"></div>
  </section>

  <section class="card">
    <h2>Add expense</h2>
    <form id="f">
      <input class="w" id="t" placeholder="What was it for?" required maxlength="60" aria-label="Title">
      <input id="a" type="number" min="1" step="any" placeholder="Amount (₹)" required aria-label="Amount">
      <select id="c" aria-label="Category">
        <option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Fun</option><option>Other</option>
      </select>
      <input class="w" id="d" type="date" required aria-label="Date">
      <button class="go w" type="submit">Add expense</button>
    </form>
    <p class="mute" style="margin:10px 0 0"><button type="button" id="demo">Fill sample data</button> <button type="button" id="wipe">Delete all</button></p>
  </section>

  <section class="card">
    <h2>Expenses</h2>
    <ul id="list"></ul>
  </section>

  <section class="card">
    <h2>By category</h2>
    <canvas id="pie" height="220" aria-label="Spending by category"></canvas>
    <div class="leg" id="leg"></div>
  </section>

  <section class="card">
    <h2>Last 7 days</h2>
    <canvas id="bars" height="220" aria-label="Spending in the last 7 days"></canvas>
  </section>
</div>

<script>
const CATS=['Food','Travel','Shopping','Bills','Fun','Other'];
const $=id=>document.getElementById(id);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
let items=[],budget=0;
const today=new Date(), iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function load(){try{items=JSON.parse(localStorage.getItem('kh_items')||'[]');budget=+localStorage.getItem('kh_budget')||0}catch(e){items=[];budget=0}}
function save(){try{localStorage.setItem('kh_items',JSON.stringify(items));localStorage.setItem('kh_budget',budget)}catch(e){}}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function setup(cv){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=+cv.getAttribute('height');
  cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);return {x,w,h};
}
function render(){
  const m=$('mon').value, mi=items.filter(i=>i.d.startsWith(m)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  const total=mi.reduce((s,i)=>s+i.a,0);
  $('spent').textContent=inr(total);
  const pct=budget?Math.min(100,total/budget*100):0;
  $('fill').style.width=pct+'%'; $('fill').style.background=budget&&total>budget?css('--bad'):css('--accent');
  $('left').innerHTML=!budget?'Set a monthly budget to see how much is left.':total>budget?`<span class="over">Over budget by ${inr(total-budget)}</span>`:`${inr(budget-total)} left of ${inr(budget)}`;
  $('list').innerHTML=mi.length?'':'<li class="mute">No expenses this month. Add your first one.</li>';
  mi.forEach(i=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="dot" style="background:var(--c${CATS.indexOf(i.c)})"></span><span class="t"></span><span class="mute">${i.d.slice(8)}/${i.d.slice(5,7)}</span><span class="a">${inr(i.a)}</span><button aria-label="Delete expense">✕</button>`;
    li.querySelector('.t').textContent=i.t;
    li.querySelector('button').onclick=()=>{items=items.filter(x=>x.id!=i.id);save();render()};
    $('list').appendChild(li);
  });
  pie(mi,total); bars();
}
function pie(mi,total){
  const {x,w,h}=setup($('pie')), sums=CATS.map(c=>mi.filter(i=>i.c==c).reduce((s,i)=>s+i.a,0));
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-6;let a0=-Math.PI/2;
  if(!total){x.strokeStyle=css('--line');x.lineWidth=R*.4;x.beginPath();x.arc(cx,cy,R*.8,0,7);x.stroke();}
  sums.forEach((s,k)=>{if(!s)return;const a1=a0+s/total*Math.PI*2;x.strokeStyle=css('--c'+k);x.lineWidth=R*.4;x.beginPath();x.arc(cx,cy,R*.8,a0,a1);x.stroke();a0=a1});
  x.fillStyle=css('--ink');x.font='600 18px Segoe UI,system-ui,sans-serif';x.textAlign='center';x.fillText(inr(total),cx,cy+6);
  $('leg').innerHTML=CATS.map((c,k)=>sums[k]?`<span><i style="background:var(--c${k})"></i>${c} ${inr(sums[k])}</span>`:'').join('');
}
function bars(){
  const {x,w,h}=setup($('bars')),days=[];
  for(let k=6;k>=0;k--){const d=new Date(today);d.setDate(d.getDate()-k);days.push(d)}
  const vals=days.map(d=>items.filter(i=>i.d==iso(d)).reduce((s,i)=>s+i.a,0)),mx=Math.max(1,...vals);
  const bw=w/7,base=h-26;
  days.forEach((d,k)=>{
    const bh=vals[k]/mx*(base-24);
    x.fillStyle=css('--accent');x.fillRect(k*bw+bw*.2,base-bh,bw*.6,bh);
    x.fillStyle=css('--mute');x.font='12px Segoe UI,system-ui,sans-serif';x.textAlign='center';
    x.fillText(d.toLocaleDateString('en',{weekday:'short'}),k*bw+bw/2,h-8);
    if(vals[k])x.fillText(inr(vals[k]),k*bw+bw/2,base-bh-5);
  });
  x.strokeStyle=css('--line');x.beginPath();x.moveTo(0,base+.5);x.lineTo(w,base+.5);x.stroke();
}

$('f').onsubmit=e=>{
  e.preventDefault();
  items.push({id:Date.now(),t:$('t').value.trim(),a:+$('a').value,c:$('c').value,d:$('d').value});
  save();$('mon').value=$('d').value.slice(0,7);$('t').value='';$('a').value='';render();$('t').focus();
};
$('budget').onchange=()=>{budget=Math.max(0,+$('budget').value||0);save();render()};
$('mon').onchange=render;
$('wipe').onclick=()=>{if(items.length&&confirm('Delete all expenses?')){items=[];save();render()}};
$('demo').onclick=()=>{
  const names={Food:['Lunch','Biryani','Groceries','Chai & snacks'],Travel:['Auto','Metro card','Train ticket'],Shopping:['T-shirt','Headphones'],Bills:['Mobile recharge','Wi-Fi'],Fun:['Movie','Gaming'],Other:['Stationery','Gift']};
  for(let k=0;k<22;k++){
    const c=CATS[Math.floor(Math.random()*6)],d=new Date(today);d.setDate(d.getDate()-Math.floor(Math.random()*Math.min(today.getDate(),14)));
    items.push({id:Date.now()+k,t:names[c][Math.floor(Math.random()*names[c].length)],a:Math.round(40+Math.random()*(c=='Shopping'||c=='Bills'?900:300)),c,d:iso(d)});
  }
  if(!budget){budget=8000;$('budget').value=budget}
  save();$('mon').value=iso(today).slice(0,7);render();
};
addEventListener('resize',render);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
load();$('mon').value=iso(today).slice(0,7);$('d').value=iso(today);$('budget').value=budget||'';render();
</script>
